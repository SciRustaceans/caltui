version: "2"

linters:
  default: standard
  enable:
    - misspell
    - revive
    - unconvert
    - bodyclose

  settings:
    errcheck:
      # Deferred Close on read handles / files is conventionally not checked.
      exclude-functions:
        - (*database/sql.Rows).Close
        - (*os.File).Close
        - (*compress/gzip.Reader).Close
        - (*archive/zip.ReadCloser).Close
        - (*database/sql.Stmt).Close
        - (*caltui/internal/store.Store).Close
        - (io.Closer).Close
        - (io.ReadCloser).Close

  exclusions:
    rules:
      # Test files may be a little looser.
      - path: _test\.go
        linters:
          - revive

formatters:
  enable:
    - gofmt
